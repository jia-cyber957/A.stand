<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A.stand</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 600px at 50% 120%, rgba(79, 70, 229, 0.28), transparent 60%),
        #0b1020;
      color: #e5e7eb;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .card { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 32px; max-width: 720px; }
    .mark {
      width: 84px; height: 84px; border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(160deg, #1f2937, #111827 62%);
      box-shadow: 0 18px 48px rgba(79, 70, 229, 0.35), inset 0 0 0 1px rgba(148, 163, 184, 0.14);
      flex: none;
    }
    .mark svg { width: 46px; height: 46px; display: block; }
    .mark.failed { box-shadow: 0 18px 48px rgba(239, 68, 68, 0.28), inset 0 0 0 1px rgba(248, 113, 113, 0.24); }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(148, 163, 184, 0.22);
      border-top-color: #818cf8;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
    p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.7; text-align: center; }
    .row { display: flex; align-items: center; gap: 10px; }
    .error-body { display: none; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
    pre {
      margin: 0; width: 100%; max-height: 46vh; overflow: auto;
      padding: 16px 18px; border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word; text-align: left;
      user-select: text;
    }
    body[data-mode="error"] .loading-body { display: none; }
    body[data-mode="error"] .error-body { display: flex; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" id="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 12 L13 52" stroke="#f8fafc" stroke-width="6.4" stroke-linecap="round" />
        <path d="M32 12 L51 52" stroke="#f8fafc" stroke-width="6.4" stroke-linecap="round" />
        <path d="M22.5 40.5 H41.5" stroke="#c7d2fe" stroke-width="5.2" stroke-linecap="round" />
      </svg>
    </div>
    <div class="loading-body row">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Starting A.stand daemon...</h1>
    </div>
    <p class="loading-body">正在启动 A.stand 本地守护进程，就绪后会自动打开控制台。</p>
    <div class="error-body">
      <h1>无法启动 A.stand 守护进程</h1>
      <pre id="reason"></pre>
    </div>
  </main>
  <script>
    // The Rust supervisor navigates here with ?reason=... when the daemon cannot boot.
    (function () {
      var reason = new URLSearchParams(location.search).get("reason");
      if (!reason) return;
      document.body.setAttribute("data-mode", "error");
      document.getElementById("mark").classList.add("failed");
      document.getElementById("reason").textContent = reason;
    })();
  </script>
</body>
</html>
