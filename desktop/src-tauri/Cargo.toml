[package]
name = "a-stand"
version = "2.0.0"
description = "A.stand native Windows desktop shell (system tray + WebView2 console)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "a-stand"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
